# The only repo-specific texts of the website. Everything else comes from the
# repository: the English intro from README.md, the commands from the built CLI.

# How the API is accessed: open | key (env: VAR) | account (token, user, password: VARs)
access:
  type: open

de:
  # German version of the README's intro paragraph. Keep it in step with README.md.
  intro: >-
    Ein schlanker **TypeScript-Client mit CLI** für den **Regionalatlas Deutschland** – die
    regionalstatistischen Indikatoren der **Statistischen Ämter des Bundes und der Länder**
    (Destatis und die 16 Landesämter), aufgeschlüsselt nach **Bundesland, Regierungsbezirk,
    Kreis und Gemeinde**. Die Daten stammen aus einem öffentlichen **ArcGIS MapServer** und
    einem statischen Indikatorenkatalog.
